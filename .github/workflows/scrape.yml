name: Scrape deals

on:
  schedule:
    - cron: "17 4 * * *"     # 06:17 SAST daily (04:17 UTC)
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated sources to run (e.g. Checkers,FoodBlogCT)"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write          # lets the built-in token push to the data branch
    steps:
      - uses: actions/checkout@v4

      # Deals + price history live on the "data" branch of this repo.
      # The app reads https://raw.githubusercontent.com/<repo>/data/deals.json
      - name: Check out data branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "$REMOTE"
          if git fetch -q --depth 1 origin data; then
            git checkout -q -b data FETCH_HEAD
          else
            echo "No data branch yet, starting one"
            git checkout -q --orphan data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Tests
        working-directory: scraper
        run: python -m pytest -q

      - name: Scrape and verify
        working-directory: scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}        # optional fallback for Pick n Pay / Checkers
          PNP_STORE_CODE: ${{ vars.PNP_STORE_CODE }}      # optional: price at a specific PnP branch
        run: python -m deals.run --data ../data --only "${{ github.event.inputs.only }}"

      - name: Publish
        working-directory: data
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add deals.json history.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -q -m "Deals $(date -u +%F)"
          git push origin data
