name: Build APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # publish the APK as a release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ + pubspec; generate the Android project around it.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org za.hj --project-name northern_deals .
          fi
          # Internet permission for release builds
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -c "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Northern Deals"|' android/app/src/main/AndroidManifest.xml
          # url_launcher needs to see browser apps on Android 11+
          sed -i 's|</queries>|  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    </queries>|' android/app/src/main/AndroidManifest.xml

      - name: Get packages, analyze, test, build
        run: |
          report() { if [ "$1" -ne 0 ]; then msg=$(tail -n 60 "$2" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=$3 failed::$msg"; fi; return "$1"; }
          set +e
          flutter pub get 2>&1 | tee /tmp/pub.log; report ${PIPESTATUS[0]} /tmp/pub.log "pub get" || exit 1
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; report ${PIPESTATUS[0]} /tmp/analyze.log Analyze || exit 1
          flutter test 2>&1 | tee /tmp/test.log; report ${PIPESTATUS[0]} /tmp/test.log Tests || exit 1
          flutter build apk --release --dart-define=DEALS_URL=${{ vars.DEALS_URL || 'https://raw.githubusercontent.com/hj367/northern-deals/data/deals.json' }} 2>&1 | tee /tmp/build.log
          report ${PIPESTATUS[0]} /tmp/build.log "APK build" || exit 1

      # A release asset downloads as a plain .apk (artifacts are always zipped).
      # Permanent link: https://github.com/<owner>/<repo>/releases/latest/download/NorthernDeals.apk
      # Sign every build with the same permanent key, so updates install over the old app.
      # The key is stored encrypted (signing/northern-deals.jks.enc); the secret unlocks it.
      - name: Sign APK with the permanent key
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning title=APK not permanently signed::Add the ANDROID_SIGNING_PASSWORD secret so updates install over the old app."
            cp build/app/outputs/flutter-apk/app-release.apk NorthernDeals.apk
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/northern-deals.jks.enc -out "$RUNNER_TEMP/key.jks" -pass env:SIGNING_PASSWORD
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/key.jks" --ks-key-alias northerndeals \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out NorthernDeals.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs NorthernDeals.apk | grep -i "SHA-256 digest"
          rm -f "$RUNNER_TEMP/key.jks"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest build from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M') UTC. Download NorthernDeals.apk below and open it on your phone."
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest NorthernDeals.apk --clobber
            gh release edit app-latest --notes "$notes" --latest
          else
            gh release create app-latest NorthernDeals.apk --title "Northern Deals app" --notes "$notes" --latest
          fi
