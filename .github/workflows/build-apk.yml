name: Build APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ + pubspec; generate the Android project around it.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org za.hj --project-name northern_deals .
          fi
          # Internet permission for release builds
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Northern Deals"|' android/app/src/main/AndroidManifest.xml
          # url_launcher needs to see browser apps on Android 11+
          sed -i 's|</queries>|  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    </queries>|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=DEALS_URL=${{ vars.DEALS_URL || 'https://raw.githubusercontent.com/hj367/northern-deals/data/deals.json' }}

      - uses: actions/upload-artifact@v4
        with:
          name: northern-deals-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
