name: Build APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ + pubspec; generate the Android project around it.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org za.hj --project-name northern_deals .
          fi
          # Internet permission for release builds
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -c "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Northern Deals"|' android/app/src/main/AndroidManifest.xml
          # url_launcher needs to see browser apps on Android 11+
          sed -i 's|</queries>|  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    </queries>|' android/app/src/main/AndroidManifest.xml

      - name: Get packages, analyze, test, build
        run: |
          report() { if [ "$1" -ne 0 ]; then msg=$(tail -n 60 "$2" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=$3 failed::$msg"; fi; return "$1"; }
          set +e
          flutter pub get 2>&1 | tee /tmp/pub.log; report ${PIPESTATUS[0]} /tmp/pub.log "pub get" || exit 1
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; report ${PIPESTATUS[0]} /tmp/analyze.log Analyze || exit 1
          flutter test 2>&1 | tee /tmp/test.log; report ${PIPESTATUS[0]} /tmp/test.log Tests || exit 1
          flutter build apk --release --dart-define=DEALS_URL=${{ vars.DEALS_URL || 'https://raw.githubusercontent.com/hj367/northern-deals/data/deals.json' }} 2>&1 | tee /tmp/build.log
          report ${PIPESTATUS[0]} /tmp/build.log "APK build" || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: northern-deals-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
